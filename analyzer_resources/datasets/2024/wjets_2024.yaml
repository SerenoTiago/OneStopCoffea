    nanoversion: "V15"
  # LO MadGraph MLM W->lnu (l = e, mu, tau) family, binned in generator-level
  # LHE HT x M(lnu): HT edges 40/100/400/800/1500/2500/inf GeV, M(lnu) edges
  # 0/120/inf GeV (12 mutually exclusive bins; all generator weights positive).
  # Coverage gap: LHE HT < 40 GeV is not generated (negligible for HT > 300).
  # x_sec in fb (OneStopCoffea convention; lumi in fb^-1).  Source: official
  # CMS XSDB LO 13.6 TeV values for the WtoLNu-4Jets_Bin-HT-*-MLNu-* primary
  # datasets, retrieved 2026-10-18 by T. Sereno, converted pb -> fb (x1000).
  # XSDB entries reference the Summer24 MiniAODv6 production; the NanoAODv15
  # datasets below are its direct DAS children with the same primary dataset
  # names.  Values are after jet matching and filter (used as-is, no extra
  # matching/filter efficiency, no k-factor).  Cross-check: GenXSecAnalyzer on
  # 3 MiniAODv6 files per sample agrees within 0.03-0.7% (<= 1.4 sigma stat).
