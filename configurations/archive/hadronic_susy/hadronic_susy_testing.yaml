common_objects: &common_objects
  - module_name: JetID
    input_col: Jet
    output_col: Jet.jetId
  - module_name: ElectronMaker
    input_col: Electron
    output_col: tightElectron
    working_point: "tight"
    # First-pass SUSY electron veto: cutBased tight and miniPFRelIso_all < 0.1.
    # dxy/dz are not applied by ElectronMaker in this version.
    min_pt: 10
    max_abs_eta: 2.5

  - module_name: ElectronMaker
    input_col: Electron
    output_col: looseElectron
    working_point: "loose"
    min_pt: 7
    max_abs_eta: 2.5

  - module_name: MuonMaker
    input_col: Muon
    output_col: tightMuon
    id_working_point: "tightId"
    # First-pass SUSY muon veto: tightId, pfIsoId >= tight, and miniPFRelIso_all < 0.2.
    min_pt: 10
    max_abs_eta: 2.4
    iso_working_point: "tight"
    max_mini_iso: 0.2

  - module_name: MuonMaker
    input_col: Muon
    output_col: looseMuon
    id_working_point: "looseId"
    min_pt: 5
    max_abs_eta: 2.4
    iso_working_point: "loose"
    max_mini_iso: 0.2

  - module_name: PhotonMaker
    input_col: Photon
    output_col: goodPhoton
    working_point: "tight"
    min_pt: 100
    max_abs_eta: 2.5
    require_electron_veto: True

  - module_name: JetFilter
    input_col: Jet
    output_col: goodJet
    include_pu_id: False
    include_jet_id: True
    min_pt: 30
    max_abs_eta: 2.4

  - module_name: JetFilter
    input_col: Jet
    output_col: htmissJet
    include_pu_id: False
    include_jet_id: True
    min_pt: 30
    max_abs_eta: 5.0

  - module_name: BJetSelector
    input_col: goodJet
    output_col: mediumBJet
    working_point: M

  - module_name: HT
    input_col: Jet
    output_col: AK4HT

  - module_name: HT
    input_col: goodJet
    output_col: HT

  - module_name: Count
    input_col: Jet
    output_col: NAK4Jet

  - module_name: Count
    input_col: goodJet
    output_col: NJet

  - module_name: Count
    input_col: mediumBJet
    output_col: NBJet

  - module_name: HTMiss
    input_col: htmissJet
    output_col: HTMiss
    output_phi_col: HTMissPhi

  - module_name: IsoTrackMaker
    input_col: IsoTrack
    output_col: goodIsoTrack
    htmiss_col: HTMiss
    htmiss_phi_col: HTMissPhi
    max_abs_eta: 2.4
    max_mt: 100
    min_lepton_track_pt: 5
    min_hadron_track_pt: 10
    max_lepton_track_iso: 0.2
    max_hadron_track_iso: 0.1
    min_from_pv: 2
    max_abs_dxy: 0.2
    max_abs_dz: 0.1
    require_high_purity: True
    require_pf_candidate: False

  - module_name: HTMissDeltaPhi
    jet_col: goodJet
    htmiss_phi_col: HTMissPhi
    output_prefix: DeltaPhiHTMissJet
    max_jets: 4

  - module_name: SearchBin
    njet_col: NJet
    nbjet_col: NBJet
    ht_col: HT
    htmiss_col: HTMiss
    output_col: SearchBin

  - module_name: Count
    input_col: looseMuon
    output_col: NlooseMuon

  - module_name: Count
    input_col: tightMuon
    output_col: NtightMuon

  - module_name: Count
    input_col: looseElectron
    output_col: NlooseElectron

  - module_name: Count
    input_col: tightElectron
    output_col: NtightElectron

common_histograms: &common_histograms
  - module_name: TopVecHistograms
    prefix: "Jet"
    input_col: goodJet
    max_idx: 6

  - module_name: FourVecHistograms
    input_col: goodJet
    hist_name: Jet
    mass_axis:
      name: "Jet $m$"
      start: 0
      stop: 500
      bins: 50

  - module_name: SimpleHistogram
    hist_name: JetHT
    input_cols: [HT]
    axes:
      - name: HT
        start: 0
        stop: 3000
        bins: 60
        unit: GeV
    
  - module_name: SimpleHistogram
    hist_name: JetN
    input_cols: [NJet]
    axes:
      - name: "$N_{jets}$"
        start: -0.5
        stop: 13.5
        bins: 14

  - module_name: SimpleHistogram
    hist_name: BJetN
    input_cols: [NBJet]
    axes:
      - name: "$N_{b}$"
        start: -0.5
        stop: 6.5
        bins: 7

  - module_name: SimpleHistogram
    hist_name: HTMiss
    input_cols: [HTMiss]
    axes:
      - name: "$H_{T}^{\\mathrm{miss}}$"
        start: 0
        stop: 3000
        bins: 60
        unit: GeV

  - module_name: SimpleHistogram
    hist_name: SearchBinYield
    input_cols: [SearchBin]
    axes:
      - name: "Search bin"
        start: 0.5
        stop: 174.5
        bins: 174

  - module_name: SimpleHistogram
    hist_name: JetQvG
    input_cols: [goodJet.btagUParTAK4QvG]
    axes:
      - name: "Jet PNetQvG Score"
        start: 0
        stop: 1
        bins: 20

  - module_name: SimpleHistogram
    hist_name: Jetbtag
    input_cols: [goodJet.btagUParTAK4B]
    axes:
      - name: "Jet UParTB Score"
        start: 0
        stop: 1
        bins: 20

  - module_name: FourVecHistograms
    input_col: Jet
    hist_name: AK4Jet
    mass_axis:
      name: "AK4Jet"
      start: 0
      stop: 500
      bins: 50
      unit: "GeV"

  - module_name: SimpleHistogram
    hist_name: AK4NJet
    input_cols: [NAK4Jet]
    axes: 
      - name: "$N_{AK4Jets}$"
        start: -0.5
        stop: 20.5
        bins: 21

  - module_name: SimpleHistogram
    hist_name: AK4JetQvG
    input_cols: [Jet.btagPNetQvG]
    axes:
      - name: "AK4Jet PNetQvG Score"
        start: 0
        stop: 1
        bins: 20

  - module_name: SimpleHistogram
    hist_name: AK4Jetbtag
    input_cols: [Jet.btagUParTAK4B]
    axes:
      - name: "AK4Jet UParTB Score"
        start: 0
        stop: 1
        bins: 20  

  - module_name: SimpleHistogram
    hist_name: AK4JetID
    input_cols: [Jet.jetId]
    axes:
      - name: "AK4Jet JetID"
        start: -0.5
        stop: 6.5
        bins: 7

  - module_name: SimpleHistogram
    hist_name: AK4HT  
    input_cols: [AK4HT]
    axes:
      - name: "AK4Jet $H_{T}$"
        start: 0
        stop: 3000
        bins: 60
        unit: "GeV"

  - module_name: SimpleHistogram
    hist_name: looseElectronN
    input_cols: [NlooseElectron]
    axes:
      - name: "$N_{\\text{loose},e}$"
        start: -0.5
        stop: 4.5
        bins: 5

  - module_name: SimpleHistogram
    hist_name: tightElectronN
    input_cols: [NtightElectron]
    axes:
      - name: "$N_{\\text{tight},e}$"
        start: -0.5
        stop: 4.5
        bins: 5

  - module_name: SimpleHistogram
    hist_name: looseMuonN
    input_cols: [NlooseMuon]
    axes:
      - name: "$N_{\\text{loose},\\mu}$"
        start: -0.5
        stop: 4.5
        bins: 5

  - module_name: SimpleHistogram
    hist_name: tightMuonN
    input_cols: [NtightMuon]
    axes:
      - name: "$N_{\\text{tight},\\mu}$"
        start: -0.5
        stop: 4.5
        bins: 5

  - module_name: SimpleHistogram
    hist_name: puppiMET_pt
    input_cols: [PuppiMET.pt]
    axes:
      - name: "$p_{T}^{\\text{PUPPI MET}}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV

  - module_name: SimpleHistogram
    hist_name: pfMET_pt
    input_cols: [PFMET.pt]
    axes:
      - name: "$p_{T}^{\\text{PF MET}}$"
        start: 0
        stop: 500
        bins: 30
        unit: GeV


analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  susy_full_validation:
    - *common_objects
    - module_name: NObjFilter
      input_col: tightElectron
      selection_name: zero_electron
      min_count: 0
      max_count: 0

    - module_name: NObjFilter
      input_col: tightMuon
      selection_name: zero_muon
      min_count: 0
      max_count: 0

    - module_name: NObjFilter
      input_col: goodPhoton
      selection_name: zero_photon
      min_count: 0
      max_count: 0

    - module_name: NObjFilter
      input_col: goodJet
      selection_name: njets
      min_count: 2

    - module_name: ScalarFilter
      input_col: HT
      selection_name: ht_gt_300
      min_value: 300

    - module_name: ScalarFilter
      input_col: HTMiss
      selection_name: htmiss_gt_300
      min_value: 300

    - module_name: HTMissLessThanHT
      ht_col: HT
      htmiss_col: HTMiss
      selection_name: htmiss_lt_ht

    - module_name: HTMissDeltaPhiSelection
      njet_col: NJet
      dphi_prefix: DeltaPhiHTMissJet
      selection_name: htmiss_dphi

    - module_name: NObjFilter
      input_col: goodIsoTrack
      selection_name: zero_iso_track
      min_count: 0
      max_count: 0

    - module_name: ScalarFilter
      input_col: SearchBin
      selection_name: search_bin_valid
      min_value: 0

    - module_name: SelectOnColumns
      sel_name: selection
    - *common_histograms

  SignalOnly:
    - module_name: SelectAllTriggers
      sel_name: all_triggers


location_priorities: [".*(T0|T1|T2).*","eos"]

event_collections:
  - dataset: '2stop_1200_2024'
    pipelines:
    - susy_full_validation

  - dataset: 'qcd*2024*'
    pipelines:
    - susy_full_validation

  - dataset: 'tt_hadronic*2024*'
    pipelines:
    - susy_full_validation

  - dataset: 'tt_semilep*2024'
    pipelines:
    - susy_full_validation
  
  - dataset: 'wjets*2024*'
    pipelines:
    - susy_full_validation

  - dataset: 'zjets*2024*'
    pipelines:
    - susy_full_validation



