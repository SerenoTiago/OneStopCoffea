Postprocessing:
  luminosity_override: 137

  default_plot_config: &plot_config
    cms_text: Preliminary
    image_type: .png
    cms_text_color: Black
    legend_num_cols: 1

  processors:
    - name: PlotSelectionFlow
      inputs: ["*/pipelines/*/*selection"]
      scale: log
      normalize: false
      count_type: weighted
      plot_configuration:
        <<: *plot_config
        extra_text: "{pipeline}"
        legend_loc: upper right
      structure:
        select: {type: SelectionFlow}
        group: {era.name: "*", pipeline: "*", name: "*"}
      output_name: analysis_products/plots/{era.name}/{pipeline}/{name}_cutflow_weighted.png

    - name: CutflowTable
      inputs: ["*/pipelines/susy_full_validation/selection"]
      count_type: both
      format: csv
      key: "{dataset_name}"
      structure:
        select: {type: SelectionFlow, dataset_name: "*", pipeline: susy_full_validation}
        group: {dataset_name: "*", era.name: "*", pipeline: "*", name: "*"}
      output_name: analysis_products/plots/{era.name}/{pipeline}/{dataset_name}_{name}_cutflow.csv

    - name: PaperSearchBinYield
      inputs: ["*/*/*/*"]
      ratio_ylim: [-1, 3]
      signal_dataset_patterns: ["2stop*", "signal*"]
      plot_configuration:
        <<: *plot_config
        cms_text_pos: 0
        legend_loc: upper right
      structure:
        select: {dataset_name: "*", name: SearchBinYield, pipeline: susy_full_validation}
        group: {pipeline: "*", era.name: "*", name: "*"}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {variation: central}
      output_name: analysis_products/plots/{era.name}/{pipeline}/{name}_Paper.png
