Postprocessing:
  default_plot_config: &default_plot_config
    cms_text: "Preliminary"
    image_type: ".png"
    cms_text_color: Black
    legend_num_cols: 1
  default_style_set: &default_style_set
    styles:
      - pattern:
          dataset_name: 'data*'
        style:
          plottype: errorbar
          color: black
          linestyle: null
          marker: 'o'

  processors:
    - name: PlotSelectionFlow
      inputs:
        - "*/pipelines/*/*selection"
      scale: log
      normalize: True
      plot_configuration:
        <<: *default_plot_config
        extra_text: "{pipeline}"
      structure:
        select: {type: SelectionFlow}
        group: {era.name: "*", pipeline: "*", name: "*", dataset_name: "*"}
        transforms:
          - name: SumSelectionFlow
            sum_match_pattern: {dataset_name: "tt*"}
            new_meta_fields:
              dataset_name: "tt"
              title: "$t\\overline{t}$"
      output_name: "plots/{era.name}/{pipeline}/{name}_cutflow_{dataset_name}.png"

    - name: Histogram1D
      inputs:
        - "*/*/*/*"
      scale: log
      normalize: True
      show_info: False
      style_set: *default_style_set
      structure:
        select: {dataset_name: "*", name: "re:^(?!.*selection$|all_triggers$|.*2d).*"}
        group: {pipeline: "*", era.name: "*", name: "*"}
        subgroups:
          unstacked: {select: {dataset_name: "re:^(data.*|2stop.*)$"}}
          stacked: {select: {dataset_name: "re:^(?!data.*|2stop.*).*$"}}
        transforms:
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
          - name: SumHistograms
            sum_match_pattern: {dataset_name: "tt*"}
            new_meta_fields:
              dataset_name: "tt"
              title: "$t\\overline{t}$"
      output_name: "plots/{era.name}/{pipeline}/{name}"

    - name: CutflowTable
      output_name: signal_yield
      inputs:
        - "*/pipelines/SignalOnly/all_triggers"
      structure:
        select: {dataset_name: "*", pipeline: "*"}
        group: {era.name: "*", name: "*"}
      output_name: "plots/{era.name}/signal_trigger_yields.csv"
